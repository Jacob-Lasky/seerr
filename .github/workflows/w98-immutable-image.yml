name: W98 immutable Seerr image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w98-immutable-seerr-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jacob-Lasky/seerr' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind source and unique image identity
        id: identity
        env:
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$REVISION"
          echo "image=ghcr.io/jacob-lasky/seerr:w98-${REVISION}-${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          # Hosted runner resources are measured, not a claimed hard memory cap.
          head -n 3 /proc/meminfo
          getconf _NPROCESSORS_ONLN

      - name: Refuse existing tag or uncertain registry response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          client = urllib.request.build_opener(NoRedirect)
          basic = base64.b64encode(('Jacob-Lasky:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request(
              'https://ghcr.io/token?service=ghcr.io&scope=repository:jacob-lasky/seerr:pull,push',
              headers={'Authorization': 'Basic ' + basic})
          try:
              with client.open(request, timeout=15) as response:
                  token = json.loads(response.read(65536))['token']
              tag = 'w98-' + os.environ['REVISION'] + '-' + os.environ['RUN_ID']
              request = urllib.request.Request(
                  'https://ghcr.io/v2/jacob-lasky/seerr/manifests/' + tag,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.oci.image.index.v1+json'}, method='HEAD')
              try:
                  with client.open(request, timeout=15):
                      raise SystemExit('Refusing existing release tag')
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise SystemExit('Registry absence not established') from None
          except (OSError, ValueError, KeyError):
              raise SystemExit('Registry preflight failed; no build admitted') from None
          print('Unique release tag absent; source-bound build admitted')
          PY

      - name: Set up builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Authenticate own registry namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 only
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.identity.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jacob-Lasky/seerr
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record immutable digest and source
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re
          digest = os.environ['DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Missing immutable image digest')
          receipt = {'repository': 'Jacob-Lasky/seerr', 'revision': os.environ['REVISION'],
                     'run_id': os.environ['RUN_ID'], 'tag': os.environ['IMAGE'],
                     'digest': digest, 'platform': 'linux/amd64',
                     'deployment_ref': 'ghcr.io/jacob-lasky/seerr@' + digest}
          text = json.dumps(receipt, sort_keys=True)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('```json\n' + text + '\n```\n')
          PY
